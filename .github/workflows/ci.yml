name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install cross toolchain, QEMU, and e2fsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-i686-linux-gnu \
            gcc-i686-linux-gnu \
            qemu-system-x86 \
            e2fsprogs

      - name: Use Ubuntu i686 cross toolchain
        run: echo "TOOLPREFIX=i686-linux-gnu-" >> "$GITHUB_ENV"

      - name: Build kernel (warnings are errors)
        run: make WERROR=1

      - name: Build initrd + user programs
        run: make initrd WERROR=1

      - name: Boot and integration tests
        run: make test
        env:
          # A runner image losing e2fsprogs must fail the ext2 suite, not
          # silently skip it (tests/run_ext2_tests.py honors this).
          NOS_REQUIRE_EXT2_TOOLS: 1

      - name: Upload serial log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: serial-log
          path: tests/serial.log
          if-no-files-found: ignore
